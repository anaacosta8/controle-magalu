<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirada de Materiais - Magalu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho com a Logo do Magazine -->
    <header>
        <h2>Controle de Retirada de Produtos</h2>
    </header>

    <!-- Menu de Abas -->
    <nav class="abas">
        <button class="btn-aba ativo" onclick="mostrarAba('lancamento')">Lançar Retirada</button>
        <button class="btn-aba" onclick="mostrarAba('configuracao')">Configuração</button>
    </nav>

    <!-- CONTEÚDO: ABA LANÇAMENTO -->
    <main id="lancamento" class="conteudo-aba ativo">
        <form id="form-retirada">
            <div class="campo">
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>
            <div class="campo">
                <label for="produto">Produto:</label>
                <input type="text" id="produto" name="produto" required>
            </div>
            <button type="submit" id="btnLancar">Lançar Retirada</button>
        </form>
        <div id="mensagem"></div>
    </main>

    <!-- CONTEÚDO: ABA CONFIGURAÇÃO -->
    <main id="configuracao" class="conteudo-aba">
        <h3>Configurações</h3>
        <p>Aqui você pode configurar os dados da planilha e outras opções.</p>
        <!-- Coloque aqui os campos de configuração que você quiser -->
    </main>

    <script src="script.js"></script>
</body>
</html>
