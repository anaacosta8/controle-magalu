<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirada de Materiais - Magalu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Controle de Retirada de Produtos</h2>
    </header>

    <nav class="abas">
        <button class="btn-aba ativo" onclick="mostrarAba('lancamento')">Lançar Retirada</button>
        <button class="btn-aba" onclick="mostrarAba('configuracao')">Configuração</button>
    </nav>

    <!-- ABA LANÇAMENTO -->
    <main id="lancamento" class="conteudo-aba ativo">
        <form id="form-retirada">
            <div class="campo">
                <label for="data">Data:</label>
                <input type="date" id="data" name="data" required>
            </div>
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="campo">
                <label for="setor">Setor:</label>
                <input type="text" id="setor" name="setor" required>
            </div>
            <div class="campo">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade" required>
            </div>
            <button type="submit" id="btnLancar">Lançar Retirada</button>
        </form>
        <div id="mensagem"></div>
    </main>

    <!-- ABA CONFIGURAÇÃO -->
    <main id="configuracao" class="conteudo-aba">
        <h3>Configurações</h3>
    </main>

    <script>
    function mostrarAba(aba) {
        document.querySelectorAll('.conteudo-aba').forEach(a => a.classList.remove('ativo'));
        document.querySelectorAll('.btn-aba').forEach(b => b.classList.remove('ativo'));
        document.getElementById(aba).classList.add('ativo');
        event.target.classList.add('ativo');
    }

    document.getElementById('form-retirada').addEventListener('submit', function(event) {
        event.preventDefault();
        document.getElementById('mensagem').innerHTML = 'Enviando...';
        alert('Dados capturados! Próximo passo é linkar com a planilha');
    });
    </script>
</body>
</html>
